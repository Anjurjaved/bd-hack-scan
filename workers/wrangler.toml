name = "bd-hack-audit-api"
main = "src/index.js"
compatibility_date = "2026-01-01"
workers_dev = true

# NOTE: account is on the Workers FREE plan → custom [limits] cpu_ms is REJECTED by the API. The shard 1102
# ("exceeded resource limits") is therefore fought entirely inside the free CPU envelope: (1) two-phase
# scanFanout (main slice advances the tick before any shard fan-out, so a shard death can't stall the engine),
# (2) per-slice SLICE_BUDGET_MS + per-domain DOMAIN_BUDGET_MS guards in scanSlice/scanDomain that skip the
# heavy WP/sitemap enumeration before the limit is hit. Heavy continuous scanning is being moved to an
# always-free Oracle VM (unmetered CPU) — see project memory.

# Every min: scan. */15 housekeeping. */20 Common Crawl *.bd. 37 */2 directories. 13 */6 crt.sh.
[triggers]
crons = ["* * * * *", "*/15 * * * *", "*/20 * * * *", "37 */2 * * *", "13 */6 * * *"]

# The live dashboard is served as static assets by this same Worker.
# Static files (index.html, config.js, fonts) are served first; any path
# without a matching file (/api/*, /claim, /ingest, …) falls through to the Worker.
[assets]
directory = "../dashboard"

[[d1_databases]]
binding = "DB"
database_name = "bd-hack-audit"
database_id = "5a01635e-b9fe-4b28-a684-ba7007118f2a"

# DB2 = hot-standby mirror. Single writer (the */15 housekeeping syncToD2), so no write-conflict.
# Dashboard reads fail over to it automatically if the primary D1 errors → zero data-blackout.
[[d1_databases]]
binding = "DB2"
database_name = "bd-hack-audit-d2"
database_id = "84bdefcb-f6eb-4a8f-8da3-d2d3c8124156"

# Service bindings: the main cron fans out to these sibling scanner shards intra-account
# (no HTTP-loop / workers.dev issues). Each runs scanTick for its slice in its own invocation.
[[services]]
binding = "SHARD1"
service = "bd-scan-1"
[[services]]
binding = "SHARD2"
service = "bd-scan-2"
[[services]]
binding = "SHARD3"
service = "bd-scan-3"
[[services]]
binding = "SHARD4"
service = "bd-scan-4"
[[services]]
binding = "SHARD5"
service = "bd-scan-5"
[[services]]
binding = "SHARD6"
service = "bd-scan-6"
[[services]]
binding = "SHARD7"
service = "bd-scan-7"
[[services]]
binding = "SHARD8"
service = "bd-scan-8"
[[services]]
binding = "SHARD9"
service = "bd-scan-9"
[[services]]
binding = "SHARD10"
service = "bd-scan-10"
[[services]]
binding = "SHARD11"
service = "bd-scan-11"
[[services]]
binding = "SHARD12"
service = "bd-scan-12"
[[services]]
binding = "SHARD13"
service = "bd-scan-13"
[[services]]
binding = "SHARD14"
service = "bd-scan-14"
[[services]]
binding = "SHARD15"
service = "bd-scan-15"

# SHARED_TOKEN is set as a secret (not here):  wrangler secret put SHARED_TOKEN
# It authorizes the scanner + harvester (write endpoints). Dashboard reads are public.
[vars]
BATCH_SIZE = "1000"
SCAN_PER_TICK = "4"
GROQ_MODEL = "llama-3.1-8b-instant"
CC_INDEX = "CC-MAIN-2026-25"
CRUX_MONTH = "202605"
SCAN_SHARDS = "16"
SCAN_SHARD = "0"
SCAN_SUBDOMAIN = "javed-it"
